# Save this file as .github/workflows/metrics.yml in the mattia-longobardo/mattia-longobardo repo.
#
# Setup (one time):
# 1. Commit this workflow, then run it manually once from the Actions tab.
#    It will commit metrics.plugin.languages.svg to the repo,
#    which the README already references.

name: Metrics
on:
  # Rebuild every day at 04:00 UTC
  schedule: [{cron: "0 4 * * *"}]
  # Allow manual runs from the Actions tab
  workflow_dispatch:
  # Rebuild on push to the default branch
  push: {branches: ["main", "master"]}

permissions:
  contents: write

jobs:
  languages:
    runs-on: ubuntu-latest
    steps:
      # 🈷️ Languages activity
      - uses: lowlighter/metrics@latest
        with:
          # Use the built-in GitHub token to avoid external PAT secret drift/expiry.
          token: ${{ github.token }}
          user: mattia-longobardo
          filename: metrics.plugin.languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: bytes-size, percentage
          plugin_languages_sections: most-used
          plugin_languages_indepth: no
