# Save this file as .github/workflows/metrics.yml in the mattia-longobardo/mattia-longobardo repo.
#
# Setup (one time):
# 1. Create a Personal Access Token (classic) at https://github.com/settings/tokens
#    → no scopes needed for public repos (add `repo` only if you want private repo data).
# 2. In the repo: Settings → Secrets and variables → Actions → New repository secret
#    → Name: METRICS_TOKEN, Value: the token.
# 3. Commit this workflow, then run it manually once from the Actions tab.
#    It will commit metrics.plugin.languages.svg to the repo,
#    which the README already references.

name: Metrics
on:
  # Rebuild every day at 04:00 UTC
  schedule: [{cron: "0 4 * * *"}]
  # Allow manual runs from the Actions tab
  workflow_dispatch:
  # Rebuild on push to the default branch
  push: {branches: ["main", "master"]}

permissions:
  contents: write

jobs:
  languages:
    runs-on: ubuntu-latest
    steps:
      # 🈷️ Languages activity
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: mattia-longobardo
          filename: metrics.plugin.languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: bytes-size, percentage
          plugin_languages_sections: most-used
          plugin_languages_indepth: no
